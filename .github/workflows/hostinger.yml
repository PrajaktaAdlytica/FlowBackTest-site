name: Build for Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish built files
        shell: bash
        run: |
          set -euo pipefail
          deploy_dir="$RUNNER_TEMP/hostinger-site"
          git fetch origin hostinger-deploy
          git worktree add -B hostinger-deploy "$deploy_dir" FETCH_HEAD
          rsync -a --delete --exclude='.git' dist/ "$deploy_dir/"
          cd "$deploy_dir"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo 'Built website is unchanged.'
          else
            git commit -m "Build website from ${GITHUB_SHA}"
            git push origin HEAD:hostinger-deploy
          fi
